name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  GROUPE_SLUG: ${{ vars.GROUPE_SLUG || 'make-thivananh' }}
  GROUPE_DISPLAY: ${{ vars.GROUPE_DISPLAY || 'Make-ThiVanAnh' }}
  COULEUR: ${{ vars.COULEUR || '#0071BC' }}
  TABLEAU_URL: ${{ vars.TABLEAU_URL || '' }}
  FRONT_PORT: ${{ vars.FRONT_PORT || '8080' }}
  MESSAGE_TTL_SECONDS: ${{ vars.MESSAGE_TTL_SECONDS || '3600' }}
  CLEANUP_INTERVAL_SECONDS: ${{ vars.CLEANUP_INTERVAL_SECONDS || '30' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push front image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-front:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-worker:${{ github.sha }}

  deploy:
    needs: [build]
    runs-on: [self-hosted, team, deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in VM_HOST VM_PORT VM_USER VM_SSH_KEY DB_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Configure SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_vm_prod
          chmod 600 ~/.ssh/id_vm_prod

      - name: Select deploy transport
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"

          if [[ "$vm_host" == "127.0.0.1" || "$vm_host" == "localhost" ]]; then
            if command -v docker >/dev/null 2>&1 && docker ps -a --format '{{.Names}}' | grep -qx 'vm-prod'; then
              docker start vm-prod >/dev/null 2>&1 || true
            fi
          fi

          if ssh-keyscan -T 3 -p "$vm_port" "$vm_host" >/dev/null 2>&1; then
            echo "DEPLOY_MODE=ssh" >> "$GITHUB_ENV"
            echo "DEPLOY_VM_HOST=$vm_host" >> "$GITHUB_ENV"
            echo "DEPLOY_VM_PORT=$vm_port" >> "$GITHUB_ENV"
            echo "Deploy mode: ssh ($vm_host:$vm_port)"
            exit 0
          fi

          if command -v docker >/dev/null 2>&1 && docker ps -a --format '{{.Names}}' | grep -qx 'vm-prod'; then
            echo "DEPLOY_MODE=docker_local" >> "$GITHUB_ENV"
            echo "Deploy mode: docker_local (vm-prod)"
            exit 0
          fi

          echo "Cannot reach SSH target ${vm_host}:${vm_port} and no local vm-prod fallback available."
          exit 1

      - name: Envoyer la description de la flotte
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          deploy_mode="$(printf '%s' "${DEPLOY_MODE:-ssh}" | tr -d '[:space:]')"

          if [[ "$deploy_mode" == "docker_local" ]]; then
            docker exec vm-prod mkdir -p /srv/flotte
            docker cp compose.prod.yml vm-prod:/srv/flotte/compose.prod.yml
            echo "Compose file copied via local Docker fallback"
            exit 0
          fi

          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" 'mkdir -p /srv/flotte'
          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new compose.prod.yml "$vm_user@$vm_host:/srv/flotte/compose.prod.yml"

      - name: Remplacer la flotte
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          deploy_mode="$(printf '%s' "${DEPLOY_MODE:-ssh}" | tr -d '[:space:]')"
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"
          tag="${GITHUB_SHA}"
          pg_password="${POSTGRES_PASSWORD:-$DB_PASSWORD}"

          {
            echo "REGISTRY=${REGISTRY}"
            echo "GROUPE_SLUG=${GROUPE_SLUG}"
            echo "GROUPE_DISPLAY=${GROUPE_DISPLAY}"
            echo "COULEUR=\"${COULEUR}\""
            echo "TABLEAU_URL=${TABLEAU_URL}"
            echo "TAG=${tag}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "POSTGRES_PASSWORD=${pg_password}"
            echo "FRONT_PORT=${FRONT_PORT}"
            echo "MESSAGE_TTL_SECONDS=${MESSAGE_TTL_SECONDS}"
            echo "CLEANUP_INTERVAL_SECONDS=${CLEANUP_INTERVAL_SECONDS}"
          } > .deploy.env

          if [[ "$deploy_mode" == "docker_local" ]]; then
            docker cp .deploy.env vm-prod:/srv/flotte/.env
            docker exec vm-prod sh -lc '
              set -eu
              cd /srv/flotte
              docker compose -f compose.prod.yml --env-file .env pull
              docker compose -f compose.prod.yml --env-file .env up -d
            '
            echo "Deployed via local Docker fallback"
            exit 0
          fi

          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new .deploy.env "$vm_user@$vm_host:/srv/flotte/.env"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" '
            set -eu
            cd /srv/flotte
            docker compose -f compose.prod.yml --env-file .env pull
            docker compose -f compose.prod.yml --env-file .env up -d
          '

      - name: Verifier que la flotte est debout
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          FRONT_PORT: ${{ vars.FRONT_PORT }}
        run: |
          set -euo pipefail
          deploy_mode="$(printf '%s' "${DEPLOY_MODE:-ssh}" | tr -d '[:space:]')"
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"
          front_port="$(printf '%s' "${FRONT_PORT:-8080}" | tr -d '[:space:]')"

          if [[ "$deploy_mode" == "docker_local" ]]; then
            docker exec -e FRONT_PORT="$front_port" vm-prod sh -lc '
              set -eu
              cd /srv/flotte

              timeout 30 sh -c "until wget -q -O- http://localhost:${FRONT_PORT}/ >/dev/null; do sleep 2; done"
              timeout 30 sh -c "until docker compose -f compose.prod.yml --env-file .env exec -T api wget -q -O- http://localhost:3000/health >/dev/null; do sleep 2; done"
              timeout 30 sh -c "until docker compose -f compose.prod.yml --env-file .env exec -T worker wget -q -O- http://localhost:3002/health >/dev/null; do sleep 2; done"
              timeout 30 sh -c "until docker compose -f compose.prod.yml --env-file .env exec -T postgres pg_isready -U message_user -d message_db >/dev/null; do sleep 2; done"

              docker compose -f compose.prod.yml --env-file .env ps
            '
            echo "Verified via local Docker fallback"
            exit 0
          fi

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" "
            set -eu
            cd /srv/flotte

            timeout 30 sh -c 'until wget -q -O- http://localhost:${front_port}/ >/dev/null; do sleep 2; done'
            timeout 30 sh -c 'until docker compose -f compose.prod.yml --env-file .env exec -T api wget -q -O- http://localhost:3000/health >/dev/null; do sleep 2; done'
            timeout 30 sh -c 'until docker compose -f compose.prod.yml --env-file .env exec -T worker wget -q -O- http://localhost:3002/health >/dev/null; do sleep 2; done'
            timeout 30 sh -c 'until docker compose -f compose.prod.yml --env-file .env exec -T postgres pg_isready -U message_user -d message_db >/dev/null; do sleep 2; done'

            docker compose -f compose.prod.yml --env-file .env ps
          "
