name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  GROUPE_SLUG: ${{ vars.GROUPE_SLUG || 'make-thivananh' }}
  GROUPE_DISPLAY: ${{ vars.GROUPE_DISPLAY || 'Make-ThiVanAnh' }}
  COULEUR: ${{ vars.COULEUR || '#0071BC' }}
  TABLEAU_URL: ${{ vars.TABLEAU_URL || '' }}
  FRONT_PORT: ${{ vars.FRONT_PORT || '8080' }}
  MESSAGE_TTL_SECONDS: ${{ vars.MESSAGE_TTL_SECONDS || '3600' }}
  CLEANUP_INTERVAL_SECONDS: ${{ vars.CLEANUP_INTERVAL_SECONDS || '30' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push front image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-front:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-worker:${{ github.sha }}

  deploy:
    needs: [build]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in VM_HOST VM_PORT VM_USER VM_SSH_KEY DB_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Configure SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_vm_prod
          chmod 600 ~/.ssh/id_vm_prod

      - name: Envoyer la description de la flotte
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" 'mkdir -p /srv/flotte'
          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new compose.prod.yml "$vm_user@$vm_host:/srv/flotte/compose.prod.yml"

      - name: Remplacer la flotte
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"
          tag="${GITHUB_SHA}"
          pg_password="${POSTGRES_PASSWORD:-$DB_PASSWORD}"

          {
            echo "REGISTRY=${REGISTRY}"
            echo "GROUPE_SLUG=${GROUPE_SLUG}"
            echo "GROUPE_DISPLAY=${GROUPE_DISPLAY}"
            echo "COULEUR=\"${COULEUR}\""
            echo "TABLEAU_URL=${TABLEAU_URL}"
            echo "TAG=${tag}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "POSTGRES_PASSWORD=${pg_password}"
            echo "FRONT_PORT=${FRONT_PORT}"
            echo "MESSAGE_TTL_SECONDS=${MESSAGE_TTL_SECONDS}"
            echo "CLEANUP_INTERVAL_SECONDS=${CLEANUP_INTERVAL_SECONDS}"
          } > .deploy.env

          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new .deploy.env "$vm_user@$vm_host:/srv/flotte/.env"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" '
            set -euo pipefail
            cd /srv/flotte
            docker compose -f compose.prod.yml --env-file .env pull
            docker compose -f compose.prod.yml --env-file .env up -d
          '

      - name: Verifier que la flotte est debout
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          FRONT_PORT: ${{ vars.FRONT_PORT }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"
          front_port="$(printf '%s' "${FRONT_PORT:-8080}" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" "
            set -euo pipefail
            cd /srv/flotte

            timeout 30 bash -c 'until wget -q -O- http://localhost:${front_port}/ >/dev/null; do sleep 2; done'
            timeout 30 bash -c 'until docker compose -f compose.prod.yml --env-file .env exec -T api wget -q -O- http://localhost:3000/health >/dev/null; do sleep 2; done'
            timeout 30 bash -c 'until docker compose -f compose.prod.yml --env-file .env exec -T worker wget -q -O- http://localhost:3002/health >/dev/null; do sleep 2; done'
            timeout 30 bash -c 'until docker compose -f compose.prod.yml --env-file .env exec -T postgres pg_isready -U message_user -d message_db >/dev/null; do sleep 2; done'

            docker compose -f compose.prod.yml --env-file .env ps
          "
