name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets and Dockerfiles
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done

          has_front=0
          has_api=0
          has_worker=0
          [[ -f front/Dockerfile ]] && has_front=1
          [[ -f api/Dockerfile ]] && has_api=1
          [[ -f worker/Dockerfile ]] && has_worker=1

          if [[ $missing -eq 0 && $has_front -eq 1 && $has_api -eq 1 && $has_worker -eq 1 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Preflight ready: build-and-push will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Preflight not ready: build-and-push will be skipped."
            echo "Expected files: front/Dockerfile, api/Dockerfile, worker/Dockerfile"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push front image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bataille-navire-front:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bataille-navire-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bataille-navire-worker:${{ github.sha }}

  release-summary:
    runs-on: ubuntu-latest
    needs: [preflight, build-and-push]
    if: always()
    steps:
      - name: Publish summary
        run: |
          {
            echo "## Release summary"
            echo ""
            echo "- preflight: ${{ needs.preflight.result }}"
            echo "- build-and-push: ${{ needs.build-and-push.result }}"
            echo "- sha: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
