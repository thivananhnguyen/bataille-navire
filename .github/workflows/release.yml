name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets and files
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done

          has_front=0
          has_api=0
          has_worker=0
          has_compose_prod=0
          [[ -f front/Dockerfile ]] && has_front=1
          [[ -f api/Dockerfile ]] && has_api=1
          [[ -f worker/Dockerfile ]] && has_worker=1
          [[ -f compose.prod.yml ]] && has_compose_prod=1

          if [[ $missing -eq 0 && $has_front -eq 1 && $has_api -eq 1 && $has_worker -eq 1 && $has_compose_prod -eq 1 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Preflight ready: build-and-push will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Preflight not ready: build-and-push will be skipped."
            echo "Expected files: front/Dockerfile, api/Dockerfile, worker/Dockerfile, compose.prod.yml"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push front image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-front:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.GROUPE_SLUG || 'make-thivananh' }}-worker:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, team, deploy]
    needs: [preflight, build-and-push]
    if: needs.preflight.outputs.ready == 'true' && needs.build-and-push.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets are present
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in VM_HOST VM_PORT VM_USER VM_SSH_KEY DB_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Configure SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm_prod
          chmod 600 ~/.ssh/id_vm_prod

      - name: Add VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"

          if [[ -z "$vm_host" || -z "$vm_port" ]]; then
            echo "VM_HOST/VM_PORT is empty after sanitization"
            exit 1
          fi

          # Retry because keyscan can fail briefly while runner/VM networking is warming up.
          ok=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 5 -p "$vm_port" "$vm_host" >> ~/.ssh/known_hosts 2>/dev/null; then
              ok=1
              break
            fi
            echo "ssh-keyscan attempt $i failed for ${vm_host}:${vm_port}, retrying..."
            sleep 2
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Unable to fetch host key from ${vm_host}:${vm_port}. Check VM_HOST/VM_PORT and runner network access."
            exit 1
          fi

      - name: Prepare deploy env file
        env:
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
          GROUPE_SLUG: ${{ vars.GROUPE_SLUG }}
          GROUPE_DISPLAY: ${{ vars.GROUPE_DISPLAY }}
          COULEUR: ${{ vars.COULEUR }}
          TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TABLEAU_URL: ${{ vars.TABLEAU_URL }}
          FRONT_PORT: ${{ vars.FRONT_PORT }}
          MESSAGE_TTL_SECONDS: ${{ vars.MESSAGE_TTL_SECONDS }}
          CLEANUP_INTERVAL_SECONDS: ${{ vars.CLEANUP_INTERVAL_SECONDS }}
        run: |
          set -euo pipefail
          : "${REGISTRY:?REGISTRY is required}"
          : "${DB_PASSWORD:?DB_PASSWORD is required}"

          GROUPE_SLUG="${GROUPE_SLUG:-make-thivananh}"
          GROUPE_DISPLAY="${GROUPE_DISPLAY:-Make-ThiVanAnh}"
          COULEUR="${COULEUR:-#0071BC}"
          TABLEAU_URL="${TABLEAU_URL:-}"
          FRONT_PORT="${FRONT_PORT:-8080}"
          MESSAGE_TTL_SECONDS="${MESSAGE_TTL_SECONDS:-3600}"
          CLEANUP_INTERVAL_SECONDS="${CLEANUP_INTERVAL_SECONDS:-30}"
          TAG="${TAG:?TAG is required}"

          pg_password="${POSTGRES_PASSWORD:-$DB_PASSWORD}"
          {
            echo "REGISTRY=$REGISTRY"
            echo "GROUPE_SLUG=$GROUPE_SLUG"
            echo "GROUPE_DISPLAY=$GROUPE_DISPLAY"
            echo "COULEUR=\"$COULEUR\""
            echo "TAG=$TAG"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "POSTGRES_PASSWORD=$pg_password"
            echo "TABLEAU_URL=$TABLEAU_URL"
            echo "FRONT_PORT=$FRONT_PORT"
            echo "MESSAGE_TTL_SECONDS=$MESSAGE_TTL_SECONDS"
            echo "CLEANUP_INTERVAL_SECONDS=$CLEANUP_INTERVAL_SECONDS"
          } > .deploy.env

      - name: Upload compose and env to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" 'mkdir -p /srv/flotte'
          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new compose.prod.yml "$vm_user@$vm_host:/srv/flotte/compose.prod.yml"
          scp -i ~/.ssh/id_vm_prod -P "$vm_port" -o StrictHostKeyChecking=accept-new .deploy.env "$vm_user@$vm_host:/srv/flotte/.env"

      - name: Deploy full fleet on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" '
            set -euo pipefail
            cd /srv/flotte
            docker compose -f compose.prod.yml --env-file .env pull
            docker compose -f compose.prod.yml --env-file .env up -d
            docker compose -f compose.prod.yml --env-file .env ps
          '

      - name: Verify deployed services
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          vm_host="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          vm_port="$(printf '%s' "$VM_PORT" | tr -d '[:space:]')"
          vm_user="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"

          ssh -i ~/.ssh/id_vm_prod -p "$vm_port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$vm_user@$vm_host" '
            set -euo pipefail
            cd /srv/flotte

            timeout 90 bash -c "until docker compose -f compose.prod.yml --env-file .env exec -T front wget -q -O- http://localhost:8080/ >/dev/null; do sleep 3; done"
            timeout 90 bash -c "until docker compose -f compose.prod.yml --env-file .env exec -T api wget -q -O- http://localhost:3000/health >/dev/null; do sleep 3; done"
            timeout 90 bash -c "until docker compose -f compose.prod.yml --env-file .env exec -T worker wget -q -O- http://localhost:3002/health >/dev/null; do sleep 3; done"
            timeout 90 bash -c "until docker compose -f compose.prod.yml --env-file .env exec -T postgres pg_isready -U message_user -d message_db >/dev/null; do sleep 3; done"

            docker compose -f compose.prod.yml --env-file .env ps
          '

  release-summary:
    runs-on: ubuntu-latest
    needs: [preflight, build-and-push, deploy]
    if: always()
    steps:
      - name: Publish summary
        run: |
          {
            echo "## Release summary"
            echo ""
            echo "- preflight: ${{ needs.preflight.result }}"
            echo "- build-and-push: ${{ needs.build-and-push.result }}"
            echo "- deploy: ${{ needs.deploy.result }}"
            echo "- sha: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
