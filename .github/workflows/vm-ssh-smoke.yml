name: vm-ssh-smoke

on:
  workflow_dispatch:

jobs:
  vm-ssh-smoke:
    runs-on: [self-hosted, team, deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM secrets are present
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in VM_HOST VM_PORT VM_USER VM_SSH_KEY; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Configure SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm_prod
          chmod 600 ~/.ssh/id_vm_prod

      - name: Add VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$VM_PORT" "$VM_HOST" >> ~/.ssh/known_hosts

      - name: SSH connectivity and docker smoke
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm_prod -p "$VM_PORT" -o BatchMode=yes \
            "$VM_USER@$VM_HOST" \
            'echo "CONNECTED_HOST=$(hostname)"; docker --version; docker ps --format "table {{.Names}}\t{{.Status}}" | head -n 15'
